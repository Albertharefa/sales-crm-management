name: One-time quotation UI standardization
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-quotation-ui.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Standardize quotation filter layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/Quotations.tsx')
          s = p.read_text()
          old = '<div className="grid gap-3 md:grid-cols-[1.5fr_1fr_1fr]">'
          new = '<div className="crm-filter-grid">'
          if old not in s:
              raise SystemExit('quotation filter layout pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/Quotations.tsx .github/workflows/one-time-quotation-ui.yml
          git rm .github/workflows/one-time-quotation-ui.yml
          git commit -m 'fix: standardize quotation filter layout'
          git push origin main
