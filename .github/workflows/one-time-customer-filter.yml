name: One-time customer filter patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Customers page
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/src/pages/Customers.tsx")
          text = path.read_text(encoding="utf-8")

          old = '''  const [sales, setSales] = useState("");\n  const [modal, setModal] = useState(false);'''
          new = '''  const [sales, setSales] = useState("");\n  const [customerFilter, setCustomerFilter] = useState("");\n  const [modal, setModal] = useState(false);'''
          if old not in text:
              raise SystemExit("state marker not found")
          text = text.replace(old, new, 1)

          old = '''    queryKey: ["customers", page, pageSize, search, status, industry, sales],'''
          new = '''    queryKey: ["customers", page, pageSize, search, status, industry, sales, customerFilter],'''
          if old not in text:
              raise SystemExit("query key marker not found")
          text = text.replace(old, new, 1)

          old = '''        `/customers?page=${page}&page_size=${pageSize}&search=${encodeURIComponent(\n          search\n        )}&status=${encodeURIComponent(status)}&industry=${encodeURIComponent(\n          industry\n        )}&sales_id=${encodeURIComponent(sales)}`'''
          new = '''        `/customers?page=${page}&page_size=${pageSize}&search=${encodeURIComponent(\n          customerFilter || search\n        )}&status=${encodeURIComponent(status)}&industry=${encodeURIComponent(\n          industry\n        )}&sales_id=${encodeURIComponent(sales)}`'''
          if old not in text:
              raise SystemExit("query search marker not found")
          text = text.replace(old, new, 1)

          old = '''  const salesOptionsQuery = useQuery({\n    queryKey: ["sales-master-options"],\n    queryFn: () => apiGet<{ id: string; name: string }[]>("/customers/sales-options"),\n    staleTime: 60_000,\n  });'''
          new = '''  const salesOptionsQuery = useQuery({\n    queryKey: ["sales-master-options"],\n    queryFn: () => apiGet<{ id: string; name: string }[]>("/customers/sales-options"),\n    staleTime: 60_000,\n  });\n\n  const customerOptionsQuery = useQuery({\n    queryKey: ["customer-filter-options"],\n    queryFn: () => apiGet<Paginated<Customer>>("/customers?page=1&page_size=100"),\n    staleTime: 60_000,\n  });'''
          if old not in text:
              raise SystemExit("sales options marker not found")
          text = text.replace(old, new, 1)

          old = '''        <select\n          className={selectClass}\n          value={sales}\n          onChange={(e) => {\n            setSales(e.target.value);\n            setPage(1);\n          }}\n          data-testid="customers-sales-filter"\n        >\n          <option value="">Semua sales</option>\n          {salesOptionsQuery.data?.map((sales) => (\n            <option key={sales.id} value={sales.id}>\n              {sales.name}\n            </option>\n          ))}\n        </select>\n\n      </div>'''
          new = '''        <select\n          className={selectClass}\n          value={sales}\n          onChange={(e) => {\n            setSales(e.target.value);\n            setPage(1);\n          }}\n          data-testid="customers-sales-filter"\n        >\n          <option value="">Semua sales</option>\n          {salesOptionsQuery.data?.map((sales) => (\n            <option key={sales.id} value={sales.id}>\n              {sales.name}\n            </option>\n          ))}\n        </select>\n\n        <select\n          className={selectClass}\n          value={customerFilter}\n          onChange={(e) => {\n            setCustomerFilter(e.target.value);\n            setPage(1);\n          }}\n          data-testid="customers-customer-filter"\n        >\n          <option value="">Semua customer</option>\n          {customerOptionsQuery.data?.items?.map((customer) => (\n            <option key={customer.id} value={customer.name}>\n              {customer.name}\n            </option>\n          ))}\n        </select>\n\n      </div>'''
          if old not in text:
              raise SystemExit("filter block marker not found")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-customer-filter.yml
          git add frontend/src/pages/Customers.tsx .github/workflows/one-time-customer-filter.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: add customer filter to Customers page"
          git push origin main
