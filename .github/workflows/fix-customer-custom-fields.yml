name: Fix customer custom fields

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Customers.tsx to use React state for Lainnya
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/pages/Customers.tsx')
          s = p.read_text()

          s = s.replace(
              '  const [pageSize, setPageSize] = useState(25);\n',
              '  const [pageSize, setPageSize] = useState(25);\n  const [industryOther, setIndustryOther] = useState(\"\");\n  const [sourceOther, setSourceOther] = useState(\"\");\n'
          )

          s = s.replace(
              '      apiPut<Customer>(`/customers/${selectedCustomerId}`, {\n        ...form,\n        email: form.email || null,\n      }),',
              '      apiPut<Customer>(`/customers/${selectedCustomerId}`, {\n        ...form,\n        industry: form.industry === \"Lainnya\" ? industryOther.trim() : form.industry,\n        source: form.source === \"Lainnya\" ? sourceOther.trim() : form.source,\n        email: form.email || null,\n      }),'
          )

          s = s.replace(
              '    setForm({\n      name: customer.name ?? \"\",\n      company_name: customer.company_name ?? \"\",\n      industry: customer.industry ?? \"Manufacturing\",\n      source: customer.source ?? \"Referral\",',
              '    const standardIndustries = [\"Manufacturing\", \"Oil & Gas\", \"Mining\", \"Otomotif\", \"FMCG\", \"Telekomunikasi\", \"Konstruksi\", \"EPC\", \"Power Generation\"];\n    const standardSources = [\"Referral\", \"Website\", \"Pameran\", \"Cold Call\", \"Partner\"];\n    const customerIndustry = customer.industry ?? \"Manufacturing\";\n    const customerSource = customer.source ?? \"Referral\";\n    setIndustryOther(standardIndustries.includes(customerIndustry) ? \"\" : customerIndustry);\n    setSourceOther(standardSources.includes(customerSource) ? \"\" : customerSource);\n\n    setForm({\n      name: customer.name ?? \"\",\n      company_name: customer.company_name ?? \"\",\n      industry: standardIndustries.includes(customerIndustry) ? customerIndustry : \"Lainnya\",\n      source: standardSources.includes(customerSource) ? customerSource : \"Lainnya\",'
          )

          s = s.replace(
              '      apiPost<Customer>("/customers", {\n        ...form,\n        email: form.email || null,\n      }),',
              '      apiPost<Customer>("/customers", {\n        ...form,\n        industry: form.industry === \"Lainnya\" ? industryOther.trim() : form.industry,\n        source: form.source === \"Lainnya\" ? sourceOther.trim() : form.source,\n        email: form.email || null,\n      }),'
          )

          s = s.replace(
              '      setForm({\n        name: \"\",\n        industry: \"Manufacturing\",',
              '      setIndustryOther(\"\");\n      setSourceOther(\"\");\n      setForm({\n        name: \"\",\n        industry: \"Manufacturing\",'
          )

          old_edit_industry = '''              <Field label="Industri">
                <select
                  className={selectClass}
                  value={form.industry}
                  onChange={(e) =>
                    setForm({ ...form, industry: e.target.value })
                  }
                >
                  <option>Manufacturing</option>
                  <option>Oil & Gas</option>
                  <option>Mining</option>
                  <option>Otomotif</option>
                  <option>FMCG</option>
                  <option>Telekomunikasi</option>
                  <option>Konstruksi</option>
                  <option>EPC</option>
                  <option>Power Generation</option>
                </select>
              </Field>'''
          new_edit_industry = '''              <Field label="Industri">
                <select
                  className={selectClass}
                  value={form.industry}
                  onChange={(e) => {
                    const value = e.target.value;
                    setForm({ ...form, industry: value });
                    if (value !== "Lainnya") setIndustryOther("");
                  }}
                >
                  <option>Manufacturing</option>
                  <option>Oil & Gas</option>
                  <option>Mining</option>
                  <option>Otomotif</option>
                  <option>FMCG</option>
                  <option>Telekomunikasi</option>
                  <option>Konstruksi</option>
                  <option>EPC</option>
                  <option>Power Generation</option>
                  <option>Lainnya</option>
                </select>
                {form.industry === "Lainnya" && (
                  <Input
                    className="mt-2"
                    value={industryOther}
                    onChange={(e) => setIndustryOther(e.target.value)}
                    placeholder="Tulis industri lainnya..."
                    data-testid="customer-industry-other-input"
                  />
                )}
              </Field>'''
          if old_edit_industry not in s:
              raise SystemExit('edit industry block not found')
          s = s.replace(old_edit_industry, new_edit_industry, 1)

          old_edit_source = '''              <Field label="Sumber">
                <select
                  className={selectClass}
                  value={form.source}
                  onChange={(e) =>
                    setForm({ ...form, source: e.target.value })
                  }
                >
                  <option>Referral</option>
                  <option>Website</option>
                  <option>Pameran</option>
                  <option>Cold Call</option>
                  <option>Partner</option>
                </select>
              </Field>'''
          new_edit_source = '''              <Field label="Sumber">
                <select
                  className={selectClass}
                  value={form.source}
                  onChange={(e) => {
                    const value = e.target.value;
                    setForm({ ...form, source: value });
                    if (value !== "Lainnya") setSourceOther("");
                  }}
                >
                  <option>Referral</option>
                  <option>Website</option>
                  <option>Pameran</option>
                  <option>Cold Call</option>
                  <option>Partner</option>
                  <option>Lainnya</option>
                </select>
                {form.source === "Lainnya" && (
                  <Input
                    className="mt-2"
                    value={sourceOther}
                    onChange={(e) => setSourceOther(e.target.value)}
                    placeholder="Tulis sumber lainnya..."
                    data-testid="customer-source-other-input"
                  />
                )}
              </Field>'''
          if old_edit_source not in s:
              raise SystemExit('edit source block not found')
          s = s.replace(old_edit_source, new_edit_source, 1)

          old_add_industry = '''            <Field label="Industri">
              <select
                className={selectClass}
                value={form.industry}
                onChange={(e) => setForm({ ...form, industry: e.target.value })}
                data-testid="customer-industry-input"
              >
                <option>Manufacturing</option>
                <option>Oil & Gas</option>
                <option>Mining</option>
                <option>Otomotif</option>
                <option>FMCG</option>
                <option>Telekomunikasi</option>
                <option>Konstruksi</option>
                <option>EPC</option>
                <option>Power Generation</option>
              </select>
            </Field>'''
          new_add_industry = '''            <Field label="Industri">
              <select
                className={selectClass}
                value={form.industry}
                onChange={(e) => {
                  const value = e.target.value;
                  setForm({ ...form, industry: value });
                  if (value !== "Lainnya") setIndustryOther("");
                }}
                data-testid="customer-industry-input"
              >
                <option>Manufacturing</option>
                <option>Oil & Gas</option>
                <option>Mining</option>
                <option>Otomotif</option>
                <option>FMCG</option>
                <option>Telekomunikasi</option>
                <option>Konstruksi</option>
                <option>EPC</option>
                <option>Power Generation</option>
                <option>Lainnya</option>
              </select>
              {form.industry === "Lainnya" && (
                <Input
                  className="mt-2"
                  value={industryOther}
                  onChange={(e) => setIndustryOther(e.target.value)}
                  placeholder="Tulis industri lainnya..."
                  data-testid="customer-industry-other-input"
                />
              )}
            </Field>'''
          if old_add_industry not in s:
              raise SystemExit('add industry block not found')
          s = s.replace(old_add_industry, new_add_industry, 1)

          old_add_source = '''            <Field label="Sumber">
              <select
                className={selectClass}
                value={form.source}
                onChange={(e) => setForm({ ...form, source: e.target.value })}
                data-testid="customer-source-input"
              >
                <option>Referral</option>
                <option>Website</option>
                <option>Pameran</option>
                <option>Cold Call</option>
                <option>Partner</option>
              </select>
            </Field>'''
          new_add_source = '''            <Field label="Sumber">
              <select
                className={selectClass}
                value={form.source}
                onChange={(e) => {
                  const value = e.target.value;
                  setForm({ ...form, source: value });
                  if (value !== "Lainnya") setSourceOther("");
                }}
                data-testid="customer-source-input"
              >
                <option>Referral</option>
                <option>Website</option>
                <option>Pameran</option>
                <option>Cold Call</option>
                <option>Partner</option>
                <option>Lainnya</option>
              </select>
              {form.source === "Lainnya" && (
                <Input
                  className="mt-2"
                  value={sourceOther}
                  onChange={(e) => setSourceOther(e.target.value)}
                  placeholder="Tulis sumber lainnya..."
                  data-testid="customer-source-other-input"
                />
              )}
            </Field>'''
          if old_add_source not in s:
              raise SystemExit('add source block not found')
          s = s.replace(old_add_source, new_add_source, 1)

          p.write_text(s)

      - name: Remove old DOM/interceptor workaround
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/App.tsx')
          s = p.read_text()
          s = s.replace("// Customer \"Lainnya\" enhancement: registers the API request guard and\n// dynamically shows the manual Industry/Source inputs. This is intentionally\n// imported for its side effect and does not alter any other menu.\nimport './customer-source-other';\n\n", "")
          p.write_text(s)
          Path('frontend/src/customer-source-other.ts').unlink(missing_ok=True)

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Customers.tsx frontend/src/App.tsx frontend/src/customer-source-other.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(customer): persist manual industry and source"
          git push
