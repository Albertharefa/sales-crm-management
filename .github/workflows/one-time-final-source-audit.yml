name: One-time Final Source Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compile all backend Python
        run: python -m compileall -q backend

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm install
          npx tsc --noEmit
          npm run build

      - name: Check no one-time workflow residue
        shell: bash
        run: |
          count=$(find .github/workflows -maxdepth 1 -type f -name 'one-time-*.yml' | wc -l)
          if [ "$count" -gt 1 ]; then
            echo "Unexpected one-time workflow residue: $count"
            find .github/workflows -maxdepth 1 -type f -name 'one-time-*.yml' -print
            exit 1
          fi

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-final-source-audit.yml
          git commit -m "chore: remove one-time final source audit workflow"
          git push origin main
