name: Activities Layout Fix 2
on:
  push:
    branches: [main]
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[activities-layout-2]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Activities filter layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/Activities.tsx')
          s = p.read_text()
          s = s.replace('md:grid-cols-2 xl:grid-cols-6', 'md:grid-cols-2 lg:grid-cols-6')
          p.write_text(s)
          PY
      - name: Build and syntax check
        run: |
          python -m compileall -q backend
          cd frontend
          npm install --no-audit --no-fund
          npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/Activities.tsx
          git commit -m 'fix: force Activities filters to six columns [activities-layout-2]'
          git push origin main
          git rm .github/workflows/activities-layout-fix-2.yml
          git commit -m 'chore: remove one-time Activities layout workflow [activities-layout-2]'
          git push origin main
