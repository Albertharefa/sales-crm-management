name: Production Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate backend syntax
        run: python -m compileall -q backend

      - name: Validate integrity router wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          server = Path('backend/server.py').read_text()
          integrity = Path('backend/routers/integrity.py').read_text()
          assert 'integrity' in server
          assert 'app.include_router(integrity.router, prefix="/api/v1")' in server
          assert 'from routers.deps import current_user' in integrity
          assert 'Depends(current_user)' in integrity
          print('Integrity router wiring OK')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript validation
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend production build
        working-directory: frontend
        run: npm run build
