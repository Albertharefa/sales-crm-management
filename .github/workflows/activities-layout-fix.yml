name: Activities Layout Fix
on:
  push:
    branches: [main]
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[activities-layout]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Activities filter grid
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/Activities.tsx')
          s = p.read_text()
          old = 'className="mt-3 grid gap-3 md:grid-cols-2 xl:grid-cols-5"'
          new = 'className="mt-3 grid gap-3 md:grid-cols-2 xl:grid-cols-6"'
          if old not in s:
              raise SystemExit('Activities filter grid class not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build and syntax check
        run: |
          python -m compileall -q backend
          cd frontend
          npm install --no-audit --no-fund
          npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/Activities.tsx
          git commit -m 'fix: fit Activities filters on one row [activities-layout]'
          git push origin main
          git rm .github/workflows/activities-layout-fix.yml
          git commit -m 'chore: remove one-time activities layout workflow [activities-layout]'
          git push origin main
