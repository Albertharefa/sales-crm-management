name: One-time Dashboard Filter Wiring

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch dashboard filters
        shell: python
        run: |
          from pathlib import Path

          router = Path("backend/routers/dashboard.py")
          text = router.read_text(encoding="utf-8")
          text = text.replace('from fastapi import APIRouter, Depends, HTTPException', 'from fastapi import APIRouter, Depends, HTTPException, Query', 1)
          old = 'async def dashboard(user: dict = Depends(current_user)):'
          new = 'async def dashboard(period: str | None = Query(None), sales_id: str | None = Query(None), stage: str | None = Query(None), customer_id: str | None = Query(None), user: dict = Depends(current_user)):'
          if old not in text:
              raise SystemExit("dashboard signature not found")
          text = text.replace(old, new, 1)
          old = 'metrics = await service.get_metrics(user)'
          new = 'metrics = await service.get_metrics(user, period=period, sales_id=sales_id, stage=stage, customer_id=customer_id)'
          if old not in text:
              raise SystemExit("dashboard service call not found")
          router.write_text(text.replace(old, new, 1), encoding="utf-8")

          service = Path("backend/services/dashboard.py")
          text = service.read_text(encoding="utf-8")
          old = '    async def get_metrics(self, user: dict) -> dict[str, Any]:\n        current = datetime.now(timezone.utc)\n        stalled_before = current - timedelta(days=30)\n        year_start = datetime(current.year, 1, 1, tzinfo=timezone.utc)\n        next_year = datetime(current.year + 1, 1, 1, tzinfo=timezone.utc)\n\n        customer_filter = await _visibility(user)\n        contact_filter = await _visibility(user)\n        lead_filter = await _visibility(user)\n        opportunity_filter = await _visibility(user)\n        activity_filter = await _visibility(user)\n        quotation_filter = await _visibility(user)\n        order_filter = await _visibility(user)\n        target_filter = await _visibility(user)'
          new = '    async def get_metrics(self, user: dict, period: str | None = None, sales_id: str | None = None, stage: str | None = None, customer_id: str | None = None) -> dict[str, Any]:\n        current = datetime.now(timezone.utc)\n        stalled_before = current - timedelta(days=30)\n        year_start = datetime(current.year, 1, 1, tzinfo=timezone.utc)\n        next_year = datetime(current.year + 1, 1, 1, tzinfo=timezone.utc)\n\n        period_days = {"30d": 30, "90d": 90, "365d": 365}.get(str(period or "").strip().lower())\n        since = current - timedelta(days=period_days) if period_days else None\n        visibility = await _visibility(user)\n\n        def scoped(extra: dict[str, Any] | None = None) -> dict[str, Any]:\n            clauses: list[dict[str, Any]] = [visibility]\n            if sales_id:\n                clauses.append({"sales_id": sales_id})\n            if customer_id:\n                clauses.append({"customer_id": customer_id})\n            if extra:\n                clauses.append(extra)\n            return clauses[0] if len(clauses) == 1 else {"$and": clauses}\n\n        customer_filter = scoped({"created_at": {"$gte": since}}) if since else scoped()\n        contact_filter = scoped({"created_at": {"$gte": since}}) if since else scoped()\n        lead_filter = scoped({"created_at": {"$gte": since}}) if since else scoped()\n        opportunity_extra: dict[str, Any] = {}\n        if stage and stage not in REFERENCE_STAGES:\n            raise HTTPException(status_code=422, detail="Stage dashboard tidak valid")\n        if stage:\n            opportunity_extra["stage"] = stage\n        if since:\n            opportunity_extra["created_at"] = {"$gte": since}\n        opportunity_filter = scoped(opportunity_extra)\n        activity_filter = scoped({"date": {"$gte": since}}) if since else scoped()\n        quotation_filter = scoped({"date": {"$gte": since}}) if since else scoped()\n        order_filter = scoped({"date": {"$gte": since}}) if since else scoped()\n        target_filter = scoped()'
          if old not in text:
              raise SystemExit("dashboard filter initialization block not found")
          service.write_text(text.replace(old, new, 1), encoding="utf-8")

          home = Path("frontend/src/pages/Home.tsx")
          text = home.read_text(encoding="utf-8")
          old = '  const query = useQuery({\n    queryKey: ["dashboard", "20260908"],\n    queryFn: async () => normalizeDashboardMetrics(await apiGet<DashboardMetrics>("/dashboard?client_version=20260908")),\n    retry: 1,\n    staleTime: 30_000,\n    refetchOnMount: "always",\n  });'
          new = '  const query = useQuery({\n    queryKey: ["dashboard", period, sales, stage, customer],\n    queryFn: async () => {\n      const periodParam = period === "30 hari terakhir" ? "30d" : period === "90 hari terakhir" ? "90d" : period === "1 tahun terakhir" ? "365d" : "";\n      const salesParam = salesOptions.find((item) => item.label === sales)?.value ?? "";\n      const params = new URLSearchParams({ client_version: "20260912" });\n      if (periodParam) params.set("period", periodParam);\n      if (salesParam) params.set("sales_id", salesParam);\n      if (stage !== "Semua stage") params.set("stage", stage);\n      if (customer !== "Semua customer") {\n        const customerParam = customerOptions.find((item) => item.label === customer)?.value ?? "";\n        if (customerParam) params.set("customer_id", customerParam);\n      }\n      return normalizeDashboardMetrics(await apiGet<DashboardMetrics>(`/dashboard?${params.toString()}`));\n    },\n    retry: 1,\n    staleTime: 30_000,\n    refetchOnMount: "always",\n  });'
          if old not in text:
              raise SystemExit("Home dashboard query block not found")
          text = text.replace(old, new, 1)
          old = '  const salesOptions = useMemo(\n    () => [\n      "Semua sales",\n      ...Array.from(\n        new Map(\n          (salesOptionsQuery.data?.users ?? [])\n            .filter((item) => String(item.role ?? "").trim().toUpperCase() === "SALES")\n            .filter((item) => item.name)\n            .map((item) => [item.id, item.name]),\n        ).values(),\n      ),\n    ],\n    [salesOptionsQuery.data],\n  );\n\n  const customerOptions = useMemo(\n    () => [\n      "Semua customer",\n      ...(customersQuery.data?.items\n        ?.map((item) => item.name || item.company_name || item.company || "")\n        .filter(Boolean) ?? []),\n    ],\n    [customersQuery.data],\n  );'
          new = '  const salesOptions = useMemo(\n    () => [\n      { label: "Semua sales", value: "" },\n      ...Array.from(\n        new Map(\n          (salesOptionsQuery.data?.users ?? [])\n            .filter((item) => String(item.role ?? "").trim().toUpperCase() === "SALES")\n            .filter((item) => item.name && item.id)\n            .map((item) => [item.id, { label: item.name, value: item.id }]),\n        ).values(),\n      ),\n    ],\n    [salesOptionsQuery.data],\n  );\n\n  const customerOptions = useMemo(\n    () => [\n      { label: "Semua customer", value: "" },\n      ...(customersQuery.data?.items\n        ?.map((item) => ({ label: item.name || item.company_name || item.company || "", value: item.id }))\n        .filter((item) => item.label && item.value) ?? []),\n    ],\n    [customersQuery.data],\n  );'
          if old not in text:
              raise SystemExit("Home filter options block not found")
          text = text.replace(old, new, 1)
          old = '              {filter.options.map((option) => (\n                <option key={option} value={option}>{option}</option>\n              ))}'
          new = '              {filter.options.map((option) => (typeof option === "string" ? <option key={option} value={option}>{option}</option> : <option key={option.value || option.label} value={option.label}>{option.label}</option>))}'
          if old not in text:
              raise SystemExit("Home filter options renderer not found")
          home.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Validate backend
        run: |
          python -m py_compile backend/routers/dashboard.py backend/services/dashboard.py
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm install
          npx tsc --noEmit
          npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routers/dashboard.py backend/services/dashboard.py frontend/src/pages/Home.tsx .github/workflows/one-time-dashboard-filters.yml
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "fix: wire dashboard filters to live metrics"
          git push origin main
          git rm .github/workflows/one-time-dashboard-filters.yml
          git commit -m "chore: remove one-time dashboard filter workflow"
          git push origin main
