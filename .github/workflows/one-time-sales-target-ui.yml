name: One-time Sales Target UI Standardization

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Standardize sales target filters
        shell: python
        run: |
          from pathlib import Path
          path = Path("frontend/src/pages/SalesTargets.tsx")
          text = path.read_text(encoding="utf-8")
          old = '<div className="mb-5 grid grid-cols-1 gap-3 md:grid-cols-[360px_220px_240px_200px]">'
          new = '<div className="crm-filter-grid mb-5">'
          if old not in text:
              raise SystemExit("SalesTargets filter wrapper not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm install
          npx tsc --noEmit
          npm run build

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/SalesTargets.tsx .github/workflows/one-time-sales-target-ui.yml
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "style: standardize sales target filter layout"
          git push origin main
          git rm .github/workflows/one-time-sales-target-ui.yml
          git commit -m "chore: remove one-time sales target UI workflow"
          git push origin main
