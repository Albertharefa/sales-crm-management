name: Fix Dashboard Customer Database

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update dashboard customer filter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("frontend/src/pages/Home.tsx")
          text = path.read_text(encoding="utf-8")

          text, removed = re.subn(
              r'\n  const dummyCustomers = \[.*?\n  \];\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )

          old = '''  const customerOptions = useMemo(
    () => [
      "Semua customer",
      ...Array.from(
        new Set([
          ...dummyCustomers,
          ...(customersQuery.data?.items?.map((item) => item.name || item.company_name || item.company || "") ?? []),
        ]),
      ).filter(Boolean),
    ],
    [customersQuery.data],
  );'''

          new = '''  const customerOptions = useMemo(
    () => [
      "Semua customer",
      ...(customersQuery.data?.items
        ?.map((item) => item.name || item.company_name || item.company || "")
        .filter(Boolean) ?? []),
    ],
    [customersQuery.data],
  );'''

          if removed != 1:
              raise SystemExit("dummyCustomers block not found")
          if old not in text:
              raise SystemExit("customerOptions block not found")

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Home.tsx .github/workflows/fix-dashboard-customer-database.yml
          git commit -m "Use live customer database in dashboard filter"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-dashboard-customer-database.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary dashboard fix workflow" || true
          git push || true
