name: One-time PO Customer Filter Patch

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch PO customer filter
        shell: python
        run: |
          from pathlib import Path

          orders = Path("backend/routers/orders.py")
          text = orders.read_text(encoding="utf-8")
          old = 'async def list_orders(page: int = Query(1, ge=1), page_size: int = Query(25, ge=1, le=100), search: str = "", status: str | None = None, sales: str | None = None, user: dict = Depends(current_user)):'
          new = 'async def list_orders(page: int = Query(1, ge=1), page_size: int = Query(25, ge=1, le=100), search: str = "", status: str | None = None, sales: str | None = None, customer: str | None = None, user: dict = Depends(current_user)):'
          if old not in text:
              raise SystemExit("orders.py signature not found")
          text = text.replace(old, new, 1)
          old = '    if sales:\n        sales_user = await db.users.find_one({"name": sales, "id": {"$in": visible_ids}}, {"_id": 0, "id": 1})\n        if not sales_user:\n            raise HTTPException(status_code=403, detail="Sales berada di luar scope Anda")\n        filters["sales_id"] = sales_user["id"]\n    return await page_collection("purchase_orders", page, page_size, search, filters)'
          new = '    if sales:\n        sales_user = await db.users.find_one({"name": sales, "id": {"$in": visible_ids}}, {"_id": 0, "id": 1})\n        if not sales_user:\n            raise HTTPException(status_code=403, detail="Sales berada di luar scope Anda")\n        filters["sales_id"] = sales_user["id"]\n    if customer:\n        customer_doc = await find_customer(customer)\n        if not customer_doc:\n            raise HTTPException(status_code=403, detail="Customer berada di luar scope Anda")\n        await ensure_customer_access(customer_doc, user)\n        filters["customer_id"] = str(customer_doc.get("id") or customer_doc.get("customer_id"))\n    return await page_collection("purchase_orders", page, page_size, search, filters)'
          if old not in text:
              raise SystemExit("orders.py filter block not found")
          orders.write_text(text.replace(old, new, 1), encoding="utf-8")

          po = Path("frontend/src/pages/PurchaseOrders.tsx")
          text = po.read_text(encoding="utf-8")
          old = '  const [salesFilter, setSalesFilter] = useState("");\n  const [quotationSearch, setQuotationSearch] = useState("");'
          new = '  const [salesFilter, setSalesFilter] = useState("");\n  const [customerFilter, setCustomerFilter] = useState("");\n  const [quotationSearch, setQuotationSearch] = useState("");'
          if old not in text:
              raise SystemExit("PurchaseOrders state block not found")
          text = text.replace(old, new, 1)
          old = 'queryKey: ["purchase-orders", page, pageSize, search, statusFilter, salesFilter], queryFn: () => apiGet<Paginated<PurchaseOrder>>(`/purchase-orders?page=${page}&page_size=${pageSize}&search=${encodeURIComponent(search)}&status=${encodeURIComponent(statusFilter)}&sales=${encodeURIComponent(salesFilter)}`)'
          new = 'queryKey: ["purchase-orders", page, pageSize, search, statusFilter, salesFilter, customerFilter], queryFn: () => apiGet<Paginated<PurchaseOrder>>(`/purchase-orders?page=${page}&page_size=${pageSize}&search=${encodeURIComponent(search)}&status=${encodeURIComponent(statusFilter)}&sales=${encodeURIComponent(salesFilter)}&customer=${encodeURIComponent(customerFilter)}`)'
          if old not in text:
              raise SystemExit("PurchaseOrders query block not found")
          text = text.replace(old, new, 1)
          old = '<div className="mb-5 grid grid-cols-1 gap-3 md:grid-cols-[minmax(360px,1fr)_220px_260px]"><div className="relative w-full"><Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" /><Input value={search} onChange={(e) => { setSearch(e.target.value); setPage(1); }} placeholder="Cari nomor PO / customer..." className="h-10 w-full pl-9" data-testid="purchase-orders-search-input" /></div><select className={selectClass + " h-10"} value={statusFilter} onChange={(e) => { setStatusFilter(e.target.value); setPage(1); }} data-testid="purchase-orders-status-filter"><option value="">Semua status</option>{STATUS_OPTIONS.map((status) => <option key={status}>{status}</option>)}</select><select className={selectClass + " h-10"} value={salesFilter} onChange={(e) => { setSalesFilter(e.target.value); setPage(1); }} data-testid="purchase-orders-sales-filter"><option value="">Semua sales</option>{sales.map((item) => <option key={item.id} value={item.name}>{item.name}</option>)}</select></div>'
          new = '<div className="crm-filter-grid mb-5"><div className="relative w-full"><Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" /><Input value={search} onChange={(e) => { setSearch(e.target.value); setPage(1); }} placeholder="Cari nomor PO / customer..." className="h-10 w-full pl-9" data-testid="purchase-orders-search-input" /></div><select className={selectClass + " h-10"} value={statusFilter} onChange={(e) => { setStatusFilter(e.target.value); setPage(1); }} data-testid="purchase-orders-status-filter"><option value="">Semua status</option>{STATUS_OPTIONS.map((status) => <option key={status}>{status}</option>)}</select><select className={selectClass + " h-10"} value={salesFilter} onChange={(e) => { setSalesFilter(e.target.value); setPage(1); }} data-testid="purchase-orders-sales-filter"><option value="">Semua sales</option>{sales.map((item) => <option key={item.id} value={item.name}>{item.name}</option>)}</select><select className={selectClass + " h-10"} value={customerFilter} onChange={(e) => { setCustomerFilter(e.target.value); setPage(1); }} data-testid="purchase-orders-customer-filter"><option value="">Semua customer</option>{customers.map((item) => <option key={item.id} value={item.id}>{item.name}</option>)}</select></div>'
          if old not in text:
              raise SystemExit("PurchaseOrders filter layout not found")
          po.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Validate backend
        run: |
          python -m py_compile backend/routers/orders.py
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm install
          npx tsc --noEmit
          npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routers/orders.py frontend/src/pages/PurchaseOrders.tsx .github/workflows/one-time-po-customer-filter.yml
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "fix: standardize purchase order filters"
          git push origin main
          git rm .github/workflows/one-time-po-customer-filter.yml
          git commit -m "chore: remove one-time PO filter workflow"
          git push origin main
