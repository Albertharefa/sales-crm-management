name: Deploy CRM to Rumahweb cPanel

on:
  workflow_run:
    workflows: ["Production Validation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend for cPanel
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.RUMAHWEB_SSH_KEY }}
        run: |
          set -e
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2223 -H rajaberkatsolusi.com >> ~/.ssh/known_hosts

      - name: Deploy application to cPanel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.RUMAHWEB_SSH_KEY }}
        run: |
          set -euo pipefail
          chmod 600 ~/.ssh/id_ed25519

          # Copy backend source into the exact cPanel Python application root.
          # Existing .env is intentionally preserved because secrets must not live in Git.
          tar --exclude='__pycache__' --exclude='.env' -czf - -C backend . \
            | ssh -p 2223 -i ~/.ssh/id_ed25519 -o BatchMode=yes rajc2417@rajaberkatsolusi.com \
              'mkdir -p /home/rajc2417/crm-rbs/backend && tar -xzf - -C /home/rajc2417/crm-rbs/backend'

          # Copy the production React build to the project-level frontend directory.
          tar -czf - -C frontend/dist . \
            | ssh -p 2223 -i ~/.ssh/id_ed25519 -o BatchMode=yes rajc2417@rajaberkatsolusi.com \
              'mkdir -p /home/rajc2417/crm-rbs/frontend/dist && tar -xzf - -C /home/rajc2417/crm-rbs/frontend/dist'

          ssh -p 2223 -i ~/.ssh/id_ed25519 -o BatchMode=yes rajc2417@rajaberkatsolusi.com 'bash -se' <<'REMOTE'
          set -euo pipefail
          APP=/home/rajc2417/crm-rbs/backend
          VENV=/home/rajc2417/virtualenv/crm-rbs/backend/3.11

          test -f "$APP/passenger_wsgi.py"
          test -f "$APP/requirements.txt"
          test -x "$VENV/bin/python"

          echo "== Python =="
          "$VENV/bin/python" --version

          echo "== Install/refresh dependencies =="
          source "$VENV/bin/activate"
          python -m pip install --disable-pip-version-check -r "$APP/requirements.txt"

          echo "== Syntax check =="
          python -m compileall -q "$APP"

          echo "== Restart Passenger =="
          mkdir -p "$APP/tmp"
          touch "$APP/tmp/restart.txt"

          echo "== Request AutoSSL check =="
          if command -v uapi >/dev/null 2>&1; then
            uapi --output=jsonpretty --user=rajc2417 SSL start_autossl_check || true
          else
            echo "uapi command not available; AutoSSL check skipped"
          fi

          echo "DEPLOYMENT_OK"
          REMOTE

      - name: Deployment result
        run: echo "GitHub main has been deployed to Rumahweb cPanel successfully."
