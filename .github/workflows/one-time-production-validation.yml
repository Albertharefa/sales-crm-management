name: One-time Production Validation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate backend
        run: python -m compileall -q backend

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm install
          npx tsc --noEmit
          npm run build

      - name: Verify production-safe startup rules
        run: |
          python - <<'PY'
          from pathlib import Path
          server = Path('backend/server.py').read_text(encoding='utf-8')
          seed = Path('backend/seed_demo_data.py').read_text(encoding='utf-8')
          assert 'await seed_demo_data()' in server
          assert 'return None' in seed
          assert 'delete_many' not in seed
          print('Startup demo seed is a no-op: PASS')
          db = Path('backend/lib/db.py').read_text(encoding='utf-8')
          for collection in ('customers','products','opportunities','activities','quotations','purchase_orders','sales_targets','tasks'):
              assert f'"{collection}"' in db, collection
          print('Automatic CRM collection indexes: PASS')
          PY

      - name: Remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-production-validation.yml
          git commit -m "chore: remove one-time production validation workflow"
          git push origin main
