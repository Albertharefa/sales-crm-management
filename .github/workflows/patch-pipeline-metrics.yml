name: Patch Pipeline Metrics

on:
  push:
    branches: [main]

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[pipeline-metrics]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Pipeline metrics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/Pipeline.tsx')
          s = p.read_text()
          old = '''  const list = useQuery({
    queryKey: ["pipeline", page, pageSize, search, stage, salesId, customerId],
    queryFn: () => apiGet<Paginated<Opportunity>>(`/pipeline?${queryParams.toString()}`),
  });
'''
          new = '''  const list = useQuery({
    queryKey: ["pipeline", page, pageSize, search, stage, salesId, customerId],
    queryFn: () => apiGet<Paginated<Opportunity>>(`/pipeline?${queryParams.toString()}`),
  });

  const metricsParams = new URLSearchParams({ page: "1", page_size: "5000" });
  if (search.trim()) metricsParams.set("search", search.trim());
  if (stage) metricsParams.set("stage", stage);
  if (salesId) metricsParams.set("sales_id", salesId);
  if (customerId) metricsParams.set("customer_id", customerId);

  const metricsQuery = useQuery({
    queryKey: ["pipeline-metrics", search, stage, salesId, customerId],
    queryFn: () => apiGet<Paginated<Opportunity>>(`/pipeline?${metricsParams.toString()}`),
    staleTime: 15_000,
  });
'''
          if old not in s:
              raise SystemExit('list block not found')
          s = s.replace(old, new, 1)
          old = '''  const items = list.data?.items ?? [];

  const metrics = useMemo(() => {
    const openItems = items.filter((item) => !["Won", "Lost"].includes(item.stage));
'''
          new = '''  const items = list.data?.items ?? [];
  const metricItems = metricsQuery.data?.items ?? items;

  const metrics = useMemo(() => {
    const openItems = metricItems.filter((item) => !["Won", "Lost"].includes(item.stage));
'''
          if old not in s:
              raise SystemExit('metrics start not found')
          s = s.replace(old, new, 1)
          old = '''      won: items
        .filter((item) => item.stage === "Won")
        .reduce((sum, item) => sum + Number(item.value || 0), 0),
      active: openItems.length,
    };
  }, [items]);
'''
          new = '''      won: metricItems
        .filter((item) => item.stage === "Won")
        .reduce((sum, item) => sum + Number(item.value || 0), 0),
      active: openItems.length,
    };
  }, [metricItems]);
'''
          if old not in s:
              raise SystemExit('metrics end not found')
          s = s.replace(old, new, 1)
          old = '''      list.refetch(),
      options.refetch(),
'''
          new = '''      list.refetch(),
      metricsQuery.refetch(),
      options.refetch(),
'''
          if old not in s:
              raise SystemExit('refresh block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Build frontend
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/Pipeline.tsx .github/workflows/patch-pipeline-metrics.yml
          git commit -m 'fix: make pipeline metrics pagination-safe [pipeline-metrics]'
          git push origin main
