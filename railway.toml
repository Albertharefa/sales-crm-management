[build]

builder = "DOCKERFILE"

dockerfilePath = "Dockerfile"


[deploy]

restartPolicyType = "ON_FAILURE"

restartPolicyMaxRetries = 10

healthcheckTimeout = 300


[deploy.envs]

PYTHONUNBUFFERED = "1"

PYTHONDONTWRITEBYTECODE = "1"
