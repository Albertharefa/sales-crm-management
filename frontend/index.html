<!doctype html>
<html lang="id">
  <!-- <html lang="en" class="dark"> — uncomment for dark-by-default (replace the tag above; `dark` is a Tailwind variant, never `@apply` it) -->
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CRM Sales Management Production untuk operasional sales B2B industri Indonesia." />
    <title>CRM Sales Management Production</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // First-render chart stabilization for Dashboard and Sales Pipeline only.
      (() => {
        const target = window.location.pathname === "/" || window.location.pathname === "/pipeline";
        if (!target) return;
        const resize = () => window.dispatchEvent(new Event("resize"));
        window.addEventListener("load", () => {
          resize();
          window.setTimeout(resize, 300);
          window.setTimeout(resize, 900);
        }, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
