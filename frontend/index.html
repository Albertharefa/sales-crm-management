<!doctype html>
<html lang="id">
  <!-- <html lang="en" class="dark"> — uncomment for dark-by-default (replace the tag above; `dark` is a Tailwind variant, never `@apply` it) -->
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CRM Sales Management Production untuk operasional sales B2B industri Indonesia." />
    <title>CRM Sales Management Production</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Dashboard/Pipeline chart first-render stabilization only.
      // Some visual components calculate their dimensions before async data/layout settles.
      // Re-issue resize after the data-driven DOM has mounted; other CRM pages are untouched.
      (() => {
        const targetPath = () => window.location.pathname === "/" || window.location.pathname === "/pipeline";
        let timer;
        const stabilize = () => {
          if (!targetPath()) return;
          window.dispatchEvent(new Event("resize"));
          clearTimeout(timer);
          timer = window.setTimeout(() => window.dispatchEvent(new Event("resize")), 250);
        };
        window.addEventListener("load", stabilize, { once: true });
        const observer = new MutationObserver(() => {
          if (targetPath()) stabilize();
        });
        observer.observe(document.getElementById("root") || document.body, { childList: true, subtree: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
