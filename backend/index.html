<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales CRM Management</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            max-width: 500px;
        }
        h1 { margin-bottom: 10px; font-size: 24px; }
        p { color: #e2e8f0; font-size: 16px; }
        .status {
            margin-top: 20px;
            display: inline-block;
            padding: 8px 16px;
            background: #48bb78;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sales CRM Management</h1>
        <p>Aplikasi Anda berhasil berjalan di Railway!</p>
        <div class="status">● Status: Online & Terhubung</div>
    </div>
</body>
</html>
